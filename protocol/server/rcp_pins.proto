/*
 * @page rcp_pins Pins
 * Pins of the RCP server: descriptors and configuration.
 *
 * The RCP server has a number of physical pins. A pin serves a function of an endpoint, identified by its handle,
 * e.g., the clock of an SPI endpoint or a GPIO. Depending on the server, the mapping of the pins to the endpoints is
 * either static or configurable. On a server with a static mapping, each pin has a fixed endpoint and function. On a
 * server with a configurable mapping, the pin configuration assigns each pin to an endpoint and to a function of that
 * endpoint.
 *
 * This file defines the descriptors that tell what the pins can do and the configuration that sets them up. The
 * configuration is part of the server configuration (`rcp.dev.fldConfig.pins`). The figure shows the configuration
 * of a server with a configurable mapping:
 *
 * ![](../figures/server/structurePins.svg)
 *
 * Pin descriptors and functions
 * =============================
 *
 * A query returns a descriptor for each pin: its unique identifier, its capabilities, such as input, output, driver
 * modes, or weak pull resistors, and the endpoints and functions that the pin can serve. On a server with a static
 * mapping, that is exactly one endpoint and function. The functions of the pins depend on the type of the endpoint,
 * e.g., clock, data in, data out, and chip-select for an SPI endpoint. There is one enumeration of functions for each
 * group of endpoint types.
 *
 * Pin configuration
 * =================
 *
 * The configuration identifies a pin by the identifier of its descriptor. On a server with a configurable mapping, it
 * assigns the pin to an endpoint. The function within the endpoint is either fixed by the handle or selected
 * explicitly, if the server supports it. On a server with a static mapping, the endpoint and the function are fixed.
 * In both cases, the configuration sets the electrical properties of the pin, such as the pull resistor, the driver
 * mode, and the pad strength. A configuration that the pin or the server does not support fails with
 * `cfgNotSupported`. The configuration can be read back with a query.
 *
 * Example
 * =======
 *
 * To use the pins 4 and 5 as clock and data output of the SPI endpoint with the handle 2, and the pin 9 as GPIO 5 with
 * a pull-up resistor:
 *
 * ```text
 * seq: 1
 * dir {
 *    config {
 *       rcp {
 *          pins {
 *             pin { num: 4  hndl: 2  spi: pinSpiSclk }
 *             pin { num: 5  hndl: 2  spi: pinSpiMosi }
 *             pin { num: 9  hndl: 1  gpio: 5  pullMode: pullUp }
 *          }
 *       }
 *    }
 * }
 * ```
 */

syntax = "proto3";
package esb.rcp.pins;

// Capabilities of a pin, used as bit mask values.
enum enCapability {
   capNone          = 0;    // No capabilities.
   capInput         = 1;    // Pin can be configured as input.
   capOutput        = 2;    // Pin can be configured as output.
   capDrvPushPull   = 4;    // Pin supports push-pull driver mode.
   capDrvOpenDrain  = 8;    // Pin supports open-drain driver mode (cannot drive strong '1').
   capDrvOpenSource = 16;   // Pin supports open-source driver mode (cannot drive strong '0').
   capTristate      = 32;   // Pin supports tristate mode.
   capRpu           = 64;   // Pin has a weak pull-up resistor.
   capRpd           = 128;  // Pin has a weak pull-down resistor.
   capIrq           = 256;  // Pin can be used as an IRQ source for notifications.
}

// Pin functions for the UART and LIN endpoints.
enum enPinFuncUart {
   pinUartTx  = 0;  // Transmit Data.
   pinUartRx  = 1;  // Receive Data.
   pinUartRts = 2;  // Ready To Send.
   pinUartCts = 3;  // Clear To Send.
}

// Pin functions for the SPI and the ADC endpoints.
enum enPinFuncSpi {
   pinSpiSclk = 0;  // Serial Clock.
   pinSpiMosi = 1;  // Master Out Slave In.
   pinSpiMiso = 2;  // Master In Slave Out.
   pinSpiCs   = 3;  // Chip-Select.
}

// Pin functions for the I2C endpoint.
enum enPinFuncI2c {
   pinI2cScl = 0;  // Serial Clock.
   pinI2cSda = 1;  // Bidirectional serial data.
}

// Pin functions for the PCM audio endpoint.
enum enPinFuncPcm {
   pinPcmSck = 0;  // Serial Clock.
   pinPcmSd  = 1;  // Serial Data.
   pinPcmWs  = 2;  // Word-Select / LR / Frame.
}

// Pin functions for the PDM endpoint.
enum enPinFuncPdm {
   pinPdmDin = 0;  // Data In.
   pinPdmClk = 1;  // Clock Out.
}

// RCP server pin descriptors.
message fldDescriptors {
   // Single instance of a pin descriptor.
   message fldDescriptor {
      uint32 num = 1;  // Unique pin identifier within the controller.

      /*
       * Pin capabilities.
       * `caps` is a bit mask, according to the `enCapability` enum.
       */
      uint32 caps = 2;

      message fldFunction {
         uint32 hndl = 1;  // Handle of the endpoint.

         oneof sub {
            enPinFuncUart uart = 2;  // UART/LIN subfunction.
            enPinFuncSpi  spi  = 3;  // SPI/ADC subfunction.
            enPinFuncI2c  i2c  = 4;  // I2C subfunction.
            enPinFuncPcm  pcm  = 5;  // PCM subfunction.
            enPinFuncPdm  pdm  = 6;  // PDM subfunction.
         };
      };

      /*
       * List of endpoints/functions the pin can be associated with.
       * If not present (empty), all handles and functions are supported.
       * On a server with a static mapping, the list holds the one endpoint and function that the pin is fixed to.
       */
      repeated fldFunction fun = 3;
   }

   repeated fldDescriptor dsc = 1;  // List of pin descriptors.
}

// Pin pull-up/down mode.
enum enPull {
   pullNone = 0;  // Disable pull-up/down.
   pullUp   = 1;  // Enable pull-up resistor.
   pullDw   = 2;  // Enable pull-down resistor.
}

// GPIO/PWM pin driver mode.
enum enDriver {
   drvPushPull   = 0;  // Push-pull: actively drives both '0' and '1'.
   drvOpenDrain  = 1;  // Open-drain: actively drives '0' only (cannot drive strong '1').
   drvOpenSource = 2;  // Open-source: actively drives '1' only (cannot drive strong '0').
}

// Container for the pin configuration message.
message fldConfig {
   // Single instance of a pin configuration.
   message fldConfigItem {
      // Unique pin identifier within the RCP server, as reported by `dev.qryPins`.
      uint32 num = 1;

      /*
       * If set, associates the pin with a specific endpoint instance.
       * The exact pin function within the specified endpoint (e.g., SPI MISO
       * or SPI MOSI) can be fixed based on the specified endpoint handle, or
       * it can be further specified using the `fun` parameter (within this
       * message), if supported by the server hardware.
       * If the pin cannot be associated with the specified endpoint instance,
       * the configuration operation fails with the `cfgNotSupported` error code.
       */
      optional uint32 hndl = 2;

      /*
       * If set, enables or disables the pin's pull-up/down resistor when
       * the endpoint supports it and the pin is in push-pull mode.
       * If the pin does not support the specified `pullMode`, the configuration
       * operation fails with the `cfgNotSupported` error code.
       */
      optional enPull pullMode = 3;

      /*
       * If set, changes the pin driver configuration.
       * If the pin does not support the specified `driverMode`, the
       * configuration operation fails with the `cfgNotSupported` error code.
       */
      optional enDriver driverMode = 4;

      /*
       * If set, defines the pad strength in microamperes (uA).
       * The specific server may round this parameter to the nearest
       * supported value.
       * To retrieve the actual value set by the HW, the client can use the
       * `dev.qryPinConfig` query.
       */
      optional uint32 padStrength = 5;

      /*
       * If set, defines the pin function within the endpoint specified by
       * the `hndl` field. If a server implementation does not support the
       * explicit selection of the pin function (i.e., the endpoint's
       * pin locations are fixed) and this field is set, the configuration
       * fails with the `cfgNotSupported` error code.
       */
      oneof fun {
         enPinFuncUart uart = 6;   // UART/LIN pin functions.
         enPinFuncSpi  spi  = 7;   // SPI/ADC pin functions.
         enPinFuncI2c  i2c  = 8;   // I2C pin functions.
         enPinFuncPcm  pcm  = 9;   // PCM pin functions.
         enPinFuncPdm  pdm  = 10;  // PDM pin functions.
         uint32        gpio = 11;  // GPIO pin index (0-based index within the controller).
      }
   }

   // List of pin configurations.
   repeated fldConfigItem pin = 1;
}
