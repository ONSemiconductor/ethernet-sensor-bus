/*
 * @page lin LIN Driver
 * LIN configuration, actions, queries, and notifications for RCP.
 *
 * A LIN endpoint is the commander of a local interconnect network (LIN) bus, also called the master. A LIN frame
 * consists of a header and a response. The endpoint always sends the header. The response comes either from the
 * endpoint itself or from a target (responder). The endpoint uses the pins TX and RX of the UART pin functions, which
 * the client connects to a LIN transceiver, see `rcp.pins.enPinFuncUart`.
 *
 * Frame
 * =====
 *
 * Every byte on the bus has a start bit, eight data bits (LSb first), and a stop bit. A frame starts with the break, a
 * long low level followed by a delimiter. The synchronization byte 0x55 lets the target measure the bit
 * time. The protected identifier (PID) holds the six-bit frame identifier and two parity bits. The response holds the
 * data bytes and a checksum.
 *
 * ![](../figures/endpoints/timingLinFrame.svg)
 *
 * Commands
 * ========
 *
 * A command sends one frame. It either publishes the response, with the bytes that the endpoint sends, or requests it,
 * with the number of bytes that the target sends. The bytes read are returned in the reply to the command. The
 * endpoint can calculate the parity bits of the identifier and the checksum of the response itself, or leave both to
 * the client.
 *
 * Example
 * =======
 *
 * To read a four-byte response from the frame with the identifier 0x12 at 19200 bits per second (bps):
 *
 * ```text
 * seq: 1
 * dir { config { hndl: 8  lin { speedBps: 19200  identifierParity: true  checksumType: checksumEnhanced } } }
 * dir { action { hndl: 8  lin { frameId: 0x12  rsize: 4 } } }
 * ```
 */

syntax = "proto3";
package esb.lin;

// Checksum type for LIN messages.
enum enChecksumType {
   checksumNone     = 0;  // Checksum disabled. The client has to handle it.
   checksumClassic  = 1;  // Classic checksum (without identifier).
   checksumEnhanced = 2;  // Enhanced checksum (with identifier).
}

// LIN configuration message.
message fldConfig {
   /*
    * The bit rate in bits per second (bps).
    * If the requested speed is fully supported by the RCP server, the configuration is accepted with the
    * `cfgSuccess` return code.
    * The RCP server is allowed to round the requested speed to the nearest supported speed within a reasonable
    * tolerance (refer to the datasheet of the server). In this case, the configuration is accepted with the
    * `cfgParamAdjusted` warning code and the client can retrieve the actual (rounded) speed by querying the
    * configuration of the endpoint.
    */
   optional uint32 speedBps = 1;

   /*
    * If set to true, the endpoint automatically calculates and appends the parity bits to the identifier.
    * Otherwise, the `fldCmd.frameId` field includes the parity bits.
    */
   optional bool identifierParity = 2;

   optional enChecksumType checksumType = 3;  // LIN checksum type.

   /*
    * If used with a LIN transceiver that loops back the transmitted data to the receiver,
    * setting this to true suppresses the loopback.
    */
   optional bool rxSuppressLoopback = 4;

   // The break condition duration in bit times.
   optional uint32 txBreakBitTime = 5;
}

// Container for LIN command.
message fldCmd {
   oneof mode {
      // Bytes to send. If checksum is enabled, checksum byte(s) are appended automatically.
      bytes wdata = 1;

      // Number of bytes to read. If checksum is enabled, checksum byte(s) are read and verified automatically.
      uint32 rsize = 2;
   }

   // Identifier of the LIN frame. If `fldConfig.identifierParity` is false, it includes the parity bits.
   uint32 frameId = 3;

   optional enChecksumType checksumType = 4;  // If set, overrides the checksum configuration for this command.
}