<?xml version="1.0" encoding="UTF-8" standalone="no"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="390" viewBox="0 0 1000 390" font-family="Arial, Helvetica, sans-serif" font-size="13">
  <title>ADC sampling and post-processing chain of one channel</title>
  <defs>
    <marker id="arrow" viewBox="0 0 10 8" refX="10" refY="4" markerWidth="10" markerHeight="8" markerUnits="userSpaceOnUse" orient="auto">
      <path d="M0,0 L10,4 L0,8 z" fill="#000000"/>
    </marker>
    <marker id="arrows" viewBox="0 0 10 8" refX="0" refY="4" markerWidth="10" markerHeight="8" markerUnits="userSpaceOnUse" orient="auto">
      <path d="M10,0 L0,4 L10,8 z" fill="#000000"/>
    </marker>
    <style>
      .n { font-size: 12px; }
      .b { font-size: 14px; font-weight: bold; }
      .c { text-anchor: middle; }
      .r { text-anchor: end; }
      .m { font-family: Consolas, 'Courier New', monospace; font-size: 13.78px; }
      .mn { font-family: Consolas, 'Courier New', monospace; font-size: 12.72px; }
      .mb { font-family: Consolas, 'Courier New', monospace; font-size: 14.84px; font-weight: bold; }
      .g { fill: #888888; }
      .blk { fill: #ffffff; stroke: #000000; stroke-width: 1.5; }
      .act { fill: #f2f2f2; stroke: #000000; stroke-width: 1.5; }
      .end { fill: #e4e4e4; stroke: #000000; stroke-width: 1.5; }
      .grp { fill: none; stroke: #888888; stroke-width: 1; stroke-dasharray: 6 4; }
      .line { fill: none; stroke: #000000; stroke-width: 1.5; }
      .loop { fill: none; stroke: #000000; stroke-width: 2; }
      .dash { fill: none; stroke: #000000; stroke-width: 1; stroke-dasharray: 4 3; }
      .thin { fill: none; stroke: #888888; stroke-width: 1; }
      .life { fill: none; stroke: #888888; stroke-width: 1; stroke-dasharray: 5 4; }
      .arrow { fill: none; stroke: #000000; stroke-width: 1.5; marker-end: url(#arrow); }
      .arrow2 { fill: none; stroke: #000000; stroke-width: 1.5; marker-start: url(#arrows); marker-end: url(#arrow); }
      .sync { fill: none; stroke: #000000; stroke-width: 1.5; stroke-dasharray: 6 4; marker-end: url(#arrow); }
      .dot { fill: #000000; }
      .head { fill: #000000; }
    </style>
  </defs>
  <rect width="1000" height="390" fill="#ffffff"/>
  <rect class="grp" x="296" y="36" width="364" height="320" rx="8"/>
  <text x="306" y="58" xml:space="preserve">One instance per channel:</text>
  <text x="306" y="75" xml:space="preserve"><tspan class="m">fldChannelConfig</tspan></text>
  <rect class="blk" x="14" y="150" width="160" height="84" rx="6"/>
  <text class="c" x="94" y="179.55" xml:space="preserve">ADC</text>
  <text class="c" x="94" y="196.55" xml:space="preserve">internal or external</text>
  <text class="c" x="94" y="213.55" xml:space="preserve"><tspan class="m">fldInterfaceSerial</tspan></text>
  <path class="arrow" d="M174,192 L306,192"/>
  <text class="c n" x="240" y="178" xml:space="preserve"><tspan class="mn">sampleRateHz</tspan></text>
  <text class="c n" x="240" y="212" xml:space="preserve"><tspan class="mn">valueType</tspan></text>
  <rect class="blk" x="306" y="162" width="124" height="60" rx="6"/>
  <text class="c" x="368" y="188.05" xml:space="preserve">Low-pass filter</text>
  <text class="c" x="368" y="205.05" xml:space="preserve"><tspan class="m">fltLP</tspan></text>
  <text class="c n" x="368" y="244" xml:space="preserve">initial output:</text>
  <text class="c n" x="368" y="260" xml:space="preserve"><tspan class="mn">initialValue</tspan></text>
  <path class="line" d="M430,192 L462,192"/>
  <path class="line" d="M462,112 L462,288"/>
  <circle class="dot" cx="462" cy="192" r="3.5"/>
  <path class="arrow" d="M462,112 L484,112"/>
  <rect class="blk" x="484" y="82" width="166" height="60" rx="6"/>
  <text class="c" x="567" y="108.05" xml:space="preserve">Decimation</text>
  <text class="c" x="567" y="125.05" xml:space="preserve"><tspan class="m">decimationFactor</tspan></text>
  <path class="arrow" d="M650,112 L700,112"/>
  <rect class="blk" x="700" y="82" width="140" height="60" rx="6"/>
  <text class="c" x="770" y="108.05" xml:space="preserve">Buffer</text>
  <text class="c" x="770" y="125.05" xml:space="preserve"><tspan class="m">bufferSizeBytes</tspan></text>
  <path class="arrow" d="M840,112 L870,112"/>
  <rect class="blk" x="870" y="82" width="114" height="60" rx="6"/>
  <text class="c" x="927" y="108.05" xml:space="preserve">Notification</text>
  <text class="c" x="927" y="125.05" xml:space="preserve">with samples</text>
  <text class="c n" x="840" y="164" xml:space="preserve">sent when the buffer is full,</text>
  <text class="c n" x="840" y="180" xml:space="preserve">unless <tspan class="mn">fldCmd.quiet</tspan> is set</text>
  <path class="arrow" d="M462,288 L484,288"/>
  <rect class="blk" x="484" y="258" width="166" height="60" rx="6"/>
  <text class="c" x="567" y="284.05" xml:space="preserve">Threshold 1 and 2</text>
  <text class="c" x="567" y="301.05" xml:space="preserve"><tspan class="m">fldThresholdConfig</tspan></text>
  <path class="line" d="M650,288 L676,288"/>
  <path class="line" d="M676,244 L676,330"/>
  <circle class="dot" cx="676" cy="288" r="3.5"/>
  <path class="arrow" d="M676,244 L700,244"/>
  <rect class="blk" x="700" y="220" width="140" height="48" rx="6"/>
  <text class="c" x="770" y="240.05" xml:space="preserve">Internal event</text>
  <text class="c" x="770" y="257.05" xml:space="preserve">triggers actions</text>
  <path class="arrow" d="M676,330 L870,330"/>
  <rect class="blk" x="870" y="300" width="114" height="60" rx="6"/>
  <text class="c" x="927" y="326.05" xml:space="preserve">Notification</text>
  <text class="c" x="927" y="343.05" xml:space="preserve"><tspan class="m">fldNotif</tspan></text>
  <text class="c n" x="772" y="322" xml:space="preserve">if <tspan class="mn">notify</tspan> is set</text>
</svg>
