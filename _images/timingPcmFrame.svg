<?xml version="1.0" encoding="UTF-8" standalone="no"?>
<svg xmlns="http://www.w3.org/2000/svg" width="900" height="548" viewBox="0 0 900 548" font-family="Arial, Helvetica, sans-serif" font-size="13">
  <title>I2S and TDM frames</title>
  <defs>
    <pattern id="hatch" width="6" height="6" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><line x1="0" y1="0" x2="0" y2="6" stroke="#9a9a9a" stroke-width="1.5"/></pattern>
  </defs>
  <rect width="900" height="548" fill="#ffffff"/>
  <text xml:space="preserve" x="12" y="24"><tspan font-weight="bold" font-size="14">I2S mode</tspan> (<tspan font-family="Consolas, 'Courier New', monospace" font-size="13.78">fsModeI2s</tspan>): two channels, FS selects left and right</text>
  <text x="120" y="104" text-anchor="end" font-size="14" font-weight="bold">FS</text>
  <text x="120" y="164" text-anchor="end" font-size="14" font-weight="bold">SD</text>
  <line x1="150" y1="50" x2="150" y2="88" stroke="#000000" stroke-width="1"/>
  <line x1="790" y1="50" x2="790" y2="88" stroke="#000000" stroke-width="1"/>
  <line x1="157" y1="58" x2="783" y2="58" stroke="#000000" stroke-width="1"/>
  <polygon points="790,58 780,62 780,54" fill="#000000"/>
  <polygon points="150,58 160,54 160,62" fill="#000000"/>
  <text xml:space="preserve" x="470" y="52" text-anchor="middle">1 / <tspan font-family="Consolas, 'Courier New', monospace" font-size="13.78">sampleRateHz</tspan>: one frame</text>
  <path d="M 140 86 H 150 V 112 H 470 V 86 H 790 V 112 H 840" fill="none" stroke="#000000" stroke-width="2"/>
  <line x1="140" y1="157" x2="150" y2="157" stroke="#888888" stroke-width="1.5"/>
  <path d="M 150 157 L 153 142 L 183 142 L 186 157 L 183 172 L 153 172 Z" fill="url(#hatch)" stroke="#000000" stroke-width="1.5"/>
  <path d="M 186 157 L 190 142 L 430 142 L 434 157 L 430 172 L 190 172 Z" fill="#ffffff" stroke="#000000" stroke-width="1.5"/>
  <text xml:space="preserve" x="310" y="161.55" text-anchor="middle">Left channel: <tspan font-family="Consolas, 'Courier New', monospace" font-size="13.78">bitsPerSample</tspan> bits</text>
  <path d="M 434 157 L 437 142 L 467 142 L 470 157 L 467 172 L 437 172 Z" fill="url(#hatch)" stroke="#000000" stroke-width="1.5"/>
  <path d="M 470 157 L 473 142 L 503 142 L 506 157 L 503 172 L 473 172 Z" fill="url(#hatch)" stroke="#000000" stroke-width="1.5"/>
  <path d="M 506 157 L 510 142 L 750 142 L 754 157 L 750 172 L 510 172 Z" fill="#ffffff" stroke="#000000" stroke-width="1.5"/>
  <text xml:space="preserve" x="630" y="161.55" text-anchor="middle">Right channel: <tspan font-family="Consolas, 'Courier New', monospace" font-size="13.78">bitsPerSample</tspan> bits</text>
  <path d="M 754 157 L 757 142 L 787 142 L 790 157 L 787 172 L 757 172 Z" fill="url(#hatch)" stroke="#000000" stroke-width="1.5"/>
  <line x1="790" y1="157" x2="840" y2="157" stroke="#888888" stroke-width="1.5"/>
  <text x="186" y="190" text-anchor="middle" font-size="12">MSb</text>
  <text x="434" y="190" text-anchor="middle" font-size="12">LSb</text>
  <text xml:space="preserve" x="12" y="268"><tspan font-weight="bold" font-size="14">TDM mode</tspan> (<tspan font-family="Consolas, 'Courier New', monospace" font-size="13.78">fsModeTdm</tspan>): <tspan font-family="Consolas, 'Courier New', monospace" font-size="13.78">numChannels</tspan> slots, FS marks the start of the frame</text>
  <text x="120" y="348" text-anchor="end" font-size="14" font-weight="bold">FS</text>
  <text x="120" y="408" text-anchor="end" font-size="14" font-weight="bold">SD</text>
  <line x1="150" y1="294" x2="150" y2="332" stroke="#000000" stroke-width="1"/>
  <line x1="790" y1="294" x2="790" y2="332" stroke="#000000" stroke-width="1"/>
  <line x1="157" y1="302" x2="783" y2="302" stroke="#000000" stroke-width="1"/>
  <polygon points="790,302 780,306 780,298" fill="#000000"/>
  <polygon points="150,302 160,298 160,306" fill="#000000"/>
  <text xml:space="preserve" x="470" y="296" text-anchor="middle">1 / <tspan font-family="Consolas, 'Courier New', monospace" font-size="13.78">sampleRateHz</tspan>: one frame</text>
  <path d="M 140 356 H 150 V 330 H 164 V 356 H 790 V 330 H 804 V 356 H 840" fill="none" stroke="#000000" stroke-width="2"/>
  <line x1="140" y1="401" x2="150" y2="401" stroke="#888888" stroke-width="1.5"/>
  <path d="M 150 401 L 153 386 L 173 386 L 176 401 L 173 416 L 153 416 Z" fill="url(#hatch)" stroke="#000000" stroke-width="1.5"/>
  <path d="M 176 401 L 180 386 L 280 386 L 284 401 L 280 416 L 180 416 Z" fill="#ffffff" stroke="#000000" stroke-width="1.5"/>
  <text x="230" y="405.55" text-anchor="middle">Channel 0</text>
  <path d="M 284 401 L 287 386 L 307 386 L 310 401 L 307 416 L 287 416 Z" fill="url(#hatch)" stroke="#000000" stroke-width="1.5"/>
  <path d="M 310 401 L 313 386 L 333 386 L 336 401 L 333 416 L 313 416 Z" fill="url(#hatch)" stroke="#000000" stroke-width="1.5"/>
  <path d="M 336 401 L 340 386 L 440 386 L 444 401 L 440 416 L 340 416 Z" fill="#ffffff" stroke="#000000" stroke-width="1.5"/>
  <text x="390" y="405.55" text-anchor="middle">Channel 1</text>
  <path d="M 444 401 L 447 386 L 467 386 L 470 401 L 467 416 L 447 416 Z" fill="url(#hatch)" stroke="#000000" stroke-width="1.5"/>
  <path d="M 470 401 L 473 386 L 493 386 L 496 401 L 493 416 L 473 416 Z" fill="url(#hatch)" stroke="#000000" stroke-width="1.5"/>
  <path d="M 496 401 L 500 386 L 600 386 L 604 401 L 600 416 L 500 416 Z" fill="#ffffff" stroke="#000000" stroke-width="1.5"/>
  <text x="550" y="405.55" text-anchor="middle">Channel 2</text>
  <path d="M 604 401 L 607 386 L 627 386 L 630 401 L 627 416 L 607 416 Z" fill="url(#hatch)" stroke="#000000" stroke-width="1.5"/>
  <path d="M 630 401 L 633 386 L 653 386 L 656 401 L 653 416 L 633 416 Z" fill="url(#hatch)" stroke="#000000" stroke-width="1.5"/>
  <path d="M 656 401 L 660 386 L 760 386 L 764 401 L 760 416 L 660 416 Z" fill="#ffffff" stroke="#000000" stroke-width="1.5"/>
  <text x="710" y="405.55" text-anchor="middle">Channel 3</text>
  <path d="M 764 401 L 767 386 L 787 386 L 790 401 L 787 416 L 767 416 Z" fill="url(#hatch)" stroke="#000000" stroke-width="1.5"/>
  <line x1="790" y1="401" x2="840" y2="401" stroke="#888888" stroke-width="1.5"/>
  <path d="M 312 424 Q 312 428 316 428 H 319 Q 323 428 323 432 Q 323 428 327 428 H 330 Q 334 428 334 424" fill="none" stroke="#000000" stroke-width="1.5"/>
  <path d="M 446 424 Q 446 428 450 428 H 453 Q 457 428 457 432 Q 457 428 461 428 H 464 Q 468 428 468 424" fill="none" stroke="#000000" stroke-width="1.5"/>
  <text xml:space="preserve" x="323" y="450" text-anchor="middle"><tspan font-family="Consolas, 'Courier New', monospace" font-size="13.78">leftBits</tspan></text>
  <text xml:space="preserve" x="457" y="450" text-anchor="middle"><tspan font-family="Consolas, 'Courier New', monospace" font-size="13.78">rightBits</tspan></text>
  <text xml:space="preserve" x="390" y="470" text-anchor="middle">each in its own <tspan font-family="Consolas, 'Courier New', monospace" font-size="13.78">fldChannelMask</tspan> entry with <tspan font-family="Consolas, 'Courier New', monospace" font-size="13.78">idx</tspan> = 1</text>
  <rect x="12" y="512" width="22" height="14" fill="url(#hatch)" stroke="#000000" stroke-width="1.5"/>
  <text xml:space="preserve" x="42" y="524">Padding bits around the sample. The endpoint ignores the ones that <tspan font-family="Consolas, 'Courier New', monospace" font-size="13.78">channelMask</tspan> selects. SCK, the bit clock, is not shown.</text>
</svg>
