<?xml version="1.0" encoding="UTF-8" standalone="no"?>
<svg xmlns="http://www.w3.org/2000/svg" width="800" height="300" viewBox="0 0 800 300" font-family="Arial, Helvetica, sans-serif" font-size="13">
  <rect width="800" height="300" fill="#ffffff"/>

  <!-- Phase boundaries: SOC, MSb, LSb, EOC -->
  <g stroke="#888888" stroke-width="1" stroke-dasharray="4 3">
    <line x1="110" y1="28" x2="110" y2="250"/>
    <line x1="230" y1="28" x2="230" y2="250"/>
    <line x1="550" y1="28" x2="550" y2="250"/>
    <line x1="710" y1="28" x2="710" y2="250"/>
  </g>
  <g text-anchor="middle" fill="#000000">
    <text x="110" y="20">SOC</text>
    <text x="230" y="20">MSb</text>
    <text x="550" y="20">LSb</text>
    <text x="710" y="20">EOC</text>
  </g>

  <!-- Signal names -->
  <g fill="#000000" font-weight="bold">
    <text x="20" y="60">SCLK</text>
    <text x="20" y="127">CS</text>
    <text x="20" y="200">DATA</text>
  </g>

  <!-- SCLK: 15 clock pulses -->
  <path fill="none" stroke="#000000" stroke-width="2"
        d="M 90 70 H 110 v-30 h20 v30 h20 v-30 h20 v30 h20 v-30 h20 v30 h20 v-30 h20 v30 h20 v-30 h20 v30 h20 v-30 h20 v30 h20 v-30 h20 v30 h20 v-30 h20 v30 h20 v-30 h20 v30 h20 v-30 h20 v30 h20 v-30 h20 v30 h20 v-30 h20 v30 h20 v-30 h20 v30 h20 v-30 h20 v30 h20 v-30 h20 v30 h20 H 760"/>

  <!-- CS: active low -->
  <path fill="none" stroke="#000000" stroke-width="2" d="M 90 105 H 100 V 135 H 712 V 105 H 760"/>

  <!-- DATA: low when idle, valid during the data clock cycles -->
  <path fill="none" stroke="#000000" stroke-width="2" d="M 90 210 H 760 M 230 210 L 238 180 H 542 L 550 210"/>
  <g stroke="#000000" stroke-width="1.5">
    <path d="M 266 180 L 274 210 M 266 210 L 274 180"/>
    <path d="M 306 180 L 314 210 M 306 210 L 314 180"/>
    <path d="M 346 180 L 354 210 M 346 210 L 354 180"/>
    <path d="M 386 180 L 394 210 M 386 210 L 394 180"/>
    <path d="M 426 180 L 434 210 M 426 210 L 434 180"/>
    <path d="M 466 180 L 474 210 M 466 210 L 474 180"/>
    <path d="M 506 180 L 514 210 M 506 210 L 514 180"/>
  </g>

  <!-- Bit/clock numbering -->
  <g text-anchor="middle" fill="#000000">
    <text x="130" y="240">1</text>
    <text x="170" y="240">2</text>
    <text x="210" y="240">3</text>
    <text x="250" y="240">7</text>
    <text x="290" y="240">6</text>
    <text x="330" y="240">5</text>
    <text x="370" y="240">4</text>
    <text x="410" y="240">3</text>
    <text x="450" y="240">2</text>
    <text x="490" y="240">1</text>
    <text x="530" y="240">0</text>
    <text x="570" y="240">1</text>
    <text x="610" y="240">2</text>
    <text x="650" y="240">3</text>
    <text x="690" y="240">4</text>
  </g>

  <!-- Phase names -->
  <g text-anchor="middle" fill="#000000" font-weight="bold">
    <text x="170" y="268">S&amp;H</text>
    <text x="390" y="268">DATA</text>
    <text x="630" y="268">PADDING</text>
  </g>

  <text x="20" y="290" fill="#555555" font-size="12">SOC = start of conversion, EOC = end of conversion</text>
</svg>
