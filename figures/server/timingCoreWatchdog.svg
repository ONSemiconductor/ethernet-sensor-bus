<?xml version="1.0" encoding="UTF-8" standalone="no"?>
<svg xmlns="http://www.w3.org/2000/svg" width="940" height="340" viewBox="0 0 940 340" font-family="Arial, Helvetica, sans-serif" font-size="13">
  <title>Network watchdog and fail-safe mode</title>
  <rect width="940" height="340" fill="#ffffff"/>
  <text x="12" y="84">Valid RCP messages</text>
  <text x="12" y="100">from the client</text>
  <line x1="227" y1="104" x2="227" y2="70" stroke="#000000" stroke-width="2"/>
  <polygon points="227,62 231,72 223,72" fill="#000000"/>
  <line x1="362" y1="104" x2="362" y2="70" stroke="#000000" stroke-width="2"/>
  <polygon points="362,62 366,72 358,72" fill="#000000"/>
  <line x1="497" y1="104" x2="497" y2="70" stroke="#000000" stroke-width="2"/>
  <polygon points="497,62 501,72 493,72" fill="#000000"/>
  <line x1="200" y1="104" x2="848" y2="104" stroke="#888888" stroke-width="1"/>
  <text x="12" y="190">Watchdog timer</text>
  <line x1="200" y1="202" x2="848" y2="202" stroke="#888888" stroke-width="1"/>
  <line x1="200" y1="142" x2="848" y2="142" stroke="#888888" stroke-width="1" stroke-dasharray="5 4"/>
  <text xml:space="preserve" x="848" y="136" text-anchor="end"><tspan font-family="Consolas, 'Courier New', monospace" font-size="13.78">watchdogTimeoutMs</tspan></text>
  <path d="M 200 202 H 227 L 362 164.5 V 202 L 497 164.5 V 202 L 713 142" fill="none" stroke="#000000" stroke-width="2"/>
  <circle cx="713" cy="142" r="4" fill="#000000"/>
  <line x1="713" y1="56" x2="713" y2="306" stroke="#888888" stroke-width="1" stroke-dasharray="3 3"/>
  <text x="705" y="62" text-anchor="end">watchdog event</text>
  <text x="12" y="276">RCP server mode</text>
  <rect x="200" y="256" width="513" height="34" fill="#ffffff" stroke="#000000" stroke-width="1.5"/>
  <text x="456.5" y="277.9" text-anchor="middle">Normal operation</text>
  <rect x="713" y="256" width="135" height="34" fill="#e4e4e4" stroke="#000000" stroke-width="1.5"/>
  <text x="780.5" y="277.9" text-anchor="middle">Fail-safe mode</text>
  <text x="721" y="246">fail-safe actions are executed</text>
