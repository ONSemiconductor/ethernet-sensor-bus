<?xml version="1.0" encoding="UTF-8" standalone="no"?>
<svg xmlns="http://www.w3.org/2000/svg" width="980" height="392" viewBox="0 0 980 392" font-family="Arial, Helvetica, sans-serif" font-size="13">
  <title>Message sequence of a synchronous and of an asynchronous action</title>
  <defs>
    <marker id="arrow" viewBox="0 0 10 8" refX="10" refY="4" markerWidth="10" markerHeight="8" markerUnits="userSpaceOnUse" orient="auto">
      <path d="M0,0 L10,4 L0,8 z" fill="#000000"/>
    </marker>
    <marker id="arrows" viewBox="0 0 10 8" refX="0" refY="4" markerWidth="10" markerHeight="8" markerUnits="userSpaceOnUse" orient="auto">
      <path d="M10,0 L0,4 L10,8 z" fill="#000000"/>
    </marker>
    <style>
      .n { font-size: 12px; }
      .b { font-size: 14px; font-weight: bold; }
      .c { text-anchor: middle; }
      .r { text-anchor: end; }
      .m { font-family: Consolas, 'Courier New', monospace; font-size: 13.78px; }
      .mn { font-family: Consolas, 'Courier New', monospace; font-size: 12.72px; }
      .mb { font-family: Consolas, 'Courier New', monospace; font-size: 14.84px; font-weight: bold; }
      .g { fill: #888888; }
      .blk { fill: #ffffff; stroke: #000000; stroke-width: 1.5; }
      .act { fill: #f2f2f2; stroke: #000000; stroke-width: 1.5; }
      .end { fill: #e4e4e4; stroke: #000000; stroke-width: 1.5; }
      .grp { fill: none; stroke: #888888; stroke-width: 1; stroke-dasharray: 6 4; }
      .line { fill: none; stroke: #000000; stroke-width: 1.5; }
      .loop { fill: none; stroke: #000000; stroke-width: 2; }
      .dash { fill: none; stroke: #000000; stroke-width: 1; stroke-dasharray: 4 3; }
      .thin { fill: none; stroke: #888888; stroke-width: 1; }
      .life { fill: none; stroke: #888888; stroke-width: 1; stroke-dasharray: 5 4; }
      .arrow { fill: none; stroke: #000000; stroke-width: 1.5; marker-end: url(#arrow); }
      .arrow2 { fill: none; stroke: #000000; stroke-width: 1.5; marker-start: url(#arrows); marker-end: url(#arrow); }
      .sync { fill: none; stroke: #000000; stroke-width: 1.5; stroke-dasharray: 6 4; marker-end: url(#arrow); }
      .dot { fill: #000000; }
      .head { fill: #000000; }
    </style>
  </defs>
  <rect width="980" height="392" fill="#ffffff"/>
  <text class="b" x="20" y="28" xml:space="preserve">Synchronous action</text>
  <text class="n" x="20" y="47" xml:space="preserve">no trigger and <tspan class="mn">repeatCount</tspan> = 0</text>
  <rect class="end" x="35" y="72" width="90" height="28" rx="6"/>
  <text class="b c" x="80" y="90.9" xml:space="preserve">Client</text>
  <path class="life" d="M80,100 L80,356"/>
  <rect class="end" x="325" y="72" width="110" height="28" rx="6"/>
  <text class="b c" x="380" y="90.9" xml:space="preserve">RCP server</text>
  <path class="life" d="M380,100 L380,356"/>
  <path class="arrow" d="M80,140 L375,140"/>
  <text class="c" x="227" y="132" xml:space="preserve"><tspan class="m">msgDirective</tspan></text>
  <text class="c n" x="227" y="157" xml:space="preserve"><tspan class="mn">action</tspan>, <tspan class="mn">seq</tspan> = 7</text>
  <rect class="blk" x="375" y="140" width="10" height="78" rx="2"/>
  <text class="r" x="364" y="183" xml:space="preserve">executes the action</text>
  <path class="arrow" d="M380,238 L80,238"/>
  <text class="c" x="227" y="230" xml:space="preserve"><tspan class="m">msgReport</tspan></text>
  <text class="c n" x="227" y="255" xml:space="preserve"><tspan class="mn">seq</tspan> = 7, <tspan class="mn">code</tspan> = <tspan class="mn">actSuccess</tspan></text>
  <text x="88" y="312" xml:space="preserve">The report carries the final result.</text>
  <path class="thin" d="M490,24 L490,372"/>
  <text class="b" x="510" y="28" xml:space="preserve">Asynchronous action</text>
  <text class="n" x="510" y="47" xml:space="preserve">a trigger is present or <tspan class="mn">repeatCount</tspan> &gt; 0</text>
  <rect class="end" x="525" y="72" width="90" height="28" rx="6"/>
  <text class="b c" x="570" y="90.9" xml:space="preserve">Client</text>
  <path class="life" d="M570,100 L570,372"/>
  <rect class="end" x="825" y="72" width="110" height="28" rx="6"/>
  <text class="b c" x="880" y="90.9" xml:space="preserve">RCP server</text>
  <path class="life" d="M880,100 L880,372"/>
  <path class="arrow" d="M570,120 L880,120"/>
  <text class="c" x="725" y="112" xml:space="preserve"><tspan class="m">msgDirective</tspan></text>
  <text class="c n" x="725" y="137" xml:space="preserve"><tspan class="mn">action</tspan> with trigger, <tspan class="mn">seq</tspan> = 8</text>
  <path class="arrow" d="M880,190 L570,190"/>
  <text class="c" x="725" y="182" xml:space="preserve"><tspan class="m">msgReport</tspan></text>
  <text class="c n" x="725" y="207" xml:space="preserve"><tspan class="mn">seq</tspan> = 8</text>
  <text class="c n" x="725" y="223" xml:space="preserve"><tspan class="mn">code</tspan> = <tspan class="mn">actPending</tspan>, <tspan class="mn">uid</tspan> = 42</text>
  <path d="M 870.93,244.06 C 875.23,250.77 884.77,244.92 889.07,251.62 L 889.07,259.94 C 884.77,253.23 875.23,259.08 870.93,252.38 Z" fill="#ffffff"/>
  <path class="line" d="M 870.93,244.06 C 875.23,250.77 884.77,244.92 889.07,251.62 M 870.93,252.38 C 875.23,259.08 884.77,253.23 889.07,259.94"/>
  <text class="r" x="864" y="256" xml:space="preserve">trigger fires</text>
  <rect class="blk" x="875" y="268" width="10" height="36" rx="2"/>
  <text class="r" x="864" y="291" xml:space="preserve">executes the action</text>
  <path class="arrow" d="M880,336 L570,336"/>
  <text class="c" x="722" y="328" xml:space="preserve"><tspan class="m">msgReport</tspan>, unsolicited</text>
  <text class="c n" x="722" y="353" xml:space="preserve"><tspan class="mn">seq</tspan> = 0, <tspan class="mn">uid</tspan> = 42</text>
  <text class="c n" x="722" y="373" xml:space="preserve"><tspan class="mn">code</tspan> = <tspan class="mn">actSuccess</tspan></text>
</svg>
