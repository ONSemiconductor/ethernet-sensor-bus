<?xml version="1.0" encoding="UTF-8" standalone="no"?>
<svg xmlns="http://www.w3.org/2000/svg" width="960" height="360" viewBox="0 0 960 360" font-family="Arial, Helvetica, sans-serif" font-size="13">
  <title>Storage and scheduling of asynchronous actions</title>
  <desc>Writing an asynchronous action to NVM does not schedule it. Startup or an explicit load copies stored actions into the scheduler without removing the stored copies.</desc>
  <defs>
    <marker id="storedActionsArrow" viewBox="0 0 10 8" refX="10" refY="4" markerWidth="10" markerHeight="8" markerUnits="userSpaceOnUse" orient="auto">
      <path d="M0,0 L10,4 L0,8 z" fill="#000000"/>
    </marker>
  </defs>
  <rect width="960" height="360" fill="#ffffff"/>
  <text x="20" y="28" font-size="14" font-weight="bold">Stored asynchronous actions</text>

  <rect x="20" y="60" width="236" height="76" rx="6" fill="#e4e4e4" stroke="#000000" stroke-width="1.5"/>
  <text x="138" y="89" text-anchor="middle" font-size="14" font-weight="bold">Directive</text>
  <text x="138" y="113" text-anchor="middle" font-family="Consolas, 'Courier New', monospace" font-size="13.78">storeToNvm: true</text>
  <path d="M256,98 L412,98" fill="none" stroke="#000000" stroke-width="1.5" marker-end="url(#storedActionsArrow)"/>
  <text x="266" y="89" font-size="12">write to NVM</text>
  <text x="20" y="170">This write does not queue the action.</text>

  <rect x="412" y="60" width="300" height="76" rx="8" fill="#f2f2f2" stroke="#000000" stroke-width="1.5"/>
  <text x="562" y="85" text-anchor="middle" font-size="14" font-weight="bold">Stored actions</text>
  <text x="562" y="106" text-anchor="middle">non-volatile memory</text>
  <text x="562" y="126" text-anchor="middle" font-size="12" xml:space="preserve">cleared by <tspan font-family="Consolas, 'Courier New', monospace" font-size="12.72">opClearStoredActions</tspan></text>
  <path d="M562,136 L562,232" fill="none" stroke="#000000" stroke-width="1.5" marker-end="url(#storedActionsArrow)"/>
  <text x="574" y="160" font-size="12">start-up or</text>
  <text x="574" y="179" font-family="Consolas, 'Courier New', monospace" font-size="12.72">opLoadStoredActions</text>

  <rect x="412" y="232" width="300" height="76" rx="8" fill="#f2f2f2" stroke="#000000" stroke-width="1.5"/>
  <text x="562" y="257" text-anchor="middle" font-size="14" font-weight="bold">Scheduled actions</text>
  <text x="562" y="278" text-anchor="middle">scheduler</text>
  <text x="562" y="298" text-anchor="middle" font-size="12">cancel operations act on these</text>
  <path d="M712,270 L790,270" fill="none" stroke="#000000" stroke-width="1.5" marker-end="url(#storedActionsArrow)"/>
  <text x="722" y="261" font-size="12">eligible</text>
  <rect x="790" y="232" width="150" height="76" rx="6" fill="#ffffff" stroke="#000000" stroke-width="1.5"/>
  <text x="865" y="261" text-anchor="middle" font-size="14" font-weight="bold">Execution</text>
  <text x="865" y="284" text-anchor="middle">on the endpoint</text>

  <text x="20" y="340">Loading keeps the stored copy. Loading again queues another copy.</text>
</svg>
