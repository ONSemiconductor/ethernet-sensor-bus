<?xml version="1.0" encoding="UTF-8" standalone="no"?>
<svg xmlns="http://www.w3.org/2000/svg" width="864" height="540" viewBox="0 0 864 540" font-family="Arial, Helvetica, sans-serif" font-size="13">
  <title>Filtering and dispatching of received Ethernet frames</title>
  <defs>
    <marker id="arrow" viewBox="0 0 10 8" refX="10" refY="4" markerWidth="10" markerHeight="8" markerUnits="userSpaceOnUse" orient="auto">
      <path d="M0,0 L10,4 L0,8 z" fill="#000000"/>
    </marker>
    <marker id="arrows" viewBox="0 0 10 8" refX="0" refY="4" markerWidth="10" markerHeight="8" markerUnits="userSpaceOnUse" orient="auto">
      <path d="M10,0 L0,4 L10,8 z" fill="#000000"/>
    </marker>
    <style>
      .n { font-size: 12px; }
      .b { font-size: 14px; font-weight: bold; }
      .c { text-anchor: middle; }
      .r { text-anchor: end; }
      .m { font-family: Consolas, 'Courier New', monospace; font-size: 13.78px; }
      .mn { font-family: Consolas, 'Courier New', monospace; font-size: 12.72px; }
      .mb { font-family: Consolas, 'Courier New', monospace; font-size: 14.84px; font-weight: bold; }
      .g { fill: #888888; }
      .blk { fill: #ffffff; stroke: #000000; stroke-width: 1.5; }
      .act { fill: #f2f2f2; stroke: #000000; stroke-width: 1.5; }
      .end { fill: #e4e4e4; stroke: #000000; stroke-width: 1.5; }
      .opt { fill: #ffffff; stroke: #000000; stroke-width: 1.5; stroke-dasharray: 7 5; }
      .opta { fill: #f2f2f2; stroke: #000000; stroke-width: 1.5; stroke-dasharray: 7 5; }
      .grp { fill: none; stroke: #888888; stroke-width: 1; stroke-dasharray: 6 4; }
      .line { fill: none; stroke: #000000; stroke-width: 1.5; }
      .loop { fill: none; stroke: #000000; stroke-width: 2; }
      .dash { fill: none; stroke: #000000; stroke-width: 1; stroke-dasharray: 4 3; }
      .thin { fill: none; stroke: #888888; stroke-width: 1; }
      .life { fill: none; stroke: #888888; stroke-width: 1; stroke-dasharray: 5 4; }
      .arrow { fill: none; stroke: #000000; stroke-width: 1.5; marker-end: url(#arrow); }
      .arrow2 { fill: none; stroke: #000000; stroke-width: 1.5; marker-start: url(#arrows); marker-end: url(#arrow); }
      .sync { fill: none; stroke: #000000; stroke-width: 1.5; stroke-dasharray: 6 4; marker-end: url(#arrow); }
      .dot { fill: #000000; }
      .head { fill: #000000; }
    </style>
  </defs>
  <rect width="864" height="540" fill="#ffffff"/>
  <rect class="grp" x="10" y="76" width="844" height="246" rx="8"/>
  <text class="n" x="22" y="94" xml:space="preserve">Filters:</text>
  <rect class="end" x="352" y="10" width="160" height="50" rx="6"/>
  <text class="c" x="432" y="31.05" xml:space="preserve">Valid Ethernet</text>
  <text class="c" x="432" y="48.05" xml:space="preserve">frame received</text>
  <path class="arrow" d="M432,60 L432,92"/>
  <rect class="act" x="316" y="92" width="232" height="68" rx="6"/>
  <text class="c" x="432" y="113.55" xml:space="preserve">Destination MAC is</text>
  <text class="c" x="432" y="130.55" xml:space="preserve">broadcast, own unicast,</text>
  <text class="c" x="432" y="147.55" xml:space="preserve">or in <tspan class="m">multicastAddrs</tspan>?</text>
  <path class="arrow" d="M548,126 L738,126"/>
  <text class="n" x="558" y="118" xml:space="preserve">No</text>
  <rect class="end" x="738" y="108" width="108" height="36" rx="6"/>
  <text class="c" x="792" y="130.55" xml:space="preserve">Ignore frame</text>
  <path class="arrow" d="M432,160 L432,194"/>
  <text class="n" x="440" y="181" xml:space="preserve">Yes</text>
  <rect class="act" x="316" y="194" width="232" height="50" rx="6"/>
  <text class="c" x="432" y="215.05" xml:space="preserve">VLAN tag missing</text>
  <text class="c" x="432" y="232.05" xml:space="preserve">or in <tspan class="m">vlanIds</tspan> list?</text>
  <path class="arrow" d="M548,219 L738,219"/>
  <text class="n" x="558" y="211" xml:space="preserve">No</text>
  <rect class="end" x="738" y="201" width="108" height="36" rx="6"/>
  <text class="c" x="792" y="223.55" xml:space="preserve">Ignore frame</text>
  <path class="arrow" d="M432,244 L432,278"/>
  <text class="n" x="440" y="265" xml:space="preserve">Yes</text>
  <rect class="act" x="18" y="278" width="828" height="36" rx="6"/>
  <text class="c" x="432" y="300.55" xml:space="preserve">EtherType is...</text>
  <path class="arrow" d="M72,314 L72,362"/>
  <text class="n" x="80" y="342" xml:space="preserve">0x88B7</text>
  <path class="arrow" d="M312,314 L312,362"/>
  <text class="n" x="320" y="342" xml:space="preserve">0x0800</text>
  <path class="arrow" d="M552,314 L552,362"/>
  <text class="n" x="560" y="342" xml:space="preserve">0x0806</text>
  <path class="arrow" d="M672,314 L672,362"/>
  <text class="n" x="680" y="342" xml:space="preserve">0x88F7</text>
  <path class="arrow" d="M792,314 L792,362"/>
  <text class="n" x="800" y="342" xml:space="preserve">Other</text>
  <rect class="blk" x="18" y="362" width="108" height="50" rx="6"/>
  <text class="c" x="72" y="383.05" xml:space="preserve">Process RCP</text>
  <text class="c" x="72" y="400.05" xml:space="preserve">frame</text>
  <rect class="opta" x="138" y="362" width="348" height="50" rx="6"/>
  <text class="c" x="312" y="383.05" xml:space="preserve">IPv4 UDP port is...</text>
  <text class="n c" x="312" y="400.05" xml:space="preserve">(optional)</text>
  <rect class="opt" x="498" y="362" width="108" height="66" rx="6"/>
  <text class="c" x="552" y="382.55" xml:space="preserve">Process ARP</text>
  <text class="c" x="552" y="399.55" xml:space="preserve">frame</text>
  <text class="n c" x="552" y="416.55" xml:space="preserve">(if IP is used)</text>
  <rect class="blk" x="618" y="362" width="108" height="50" rx="6"/>
  <text class="c" x="672" y="383.05" xml:space="preserve">Process PTP</text>
  <text class="c" x="672" y="400.05" xml:space="preserve">frame</text>
  <rect class="end" x="738" y="362" width="108" height="36" rx="6"/>
  <text class="c" x="792" y="384.55" xml:space="preserve">Ignore frame</text>
  <path class="arrow" d="M192,412 L192,458"/>
  <text class="n" x="200" y="438" xml:space="preserve">7771</text>
  <path class="arrow" d="M312,412 L312,458"/>
  <text class="n" x="320" y="438" xml:space="preserve">68</text>
  <path class="arrow" d="M432,412 L432,458"/>
  <text class="n" x="440" y="438" xml:space="preserve">Other</text>
  <rect class="blk" x="138" y="458" width="108" height="50" rx="6"/>
  <text class="c" x="192" y="479.05" xml:space="preserve">Process RCP</text>
  <text class="c" x="192" y="496.05" xml:space="preserve">frame</text>
  <rect class="opt" x="258" y="458" width="108" height="66" rx="6"/>
  <text class="c" x="312" y="478.55" xml:space="preserve">Process DHCP/</text>
  <text class="c" x="312" y="495.55" xml:space="preserve">BOOTP frame</text>
  <text class="n c" x="312" y="512.55" xml:space="preserve">(optional)</text>
  <rect class="end" x="378" y="458" width="108" height="36" rx="6"/>
  <text class="c" x="432" y="480.55" xml:space="preserve">Ignore frame</text>
</svg>
