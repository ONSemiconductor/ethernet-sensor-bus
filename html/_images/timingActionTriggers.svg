<?xml version="1.0" encoding="UTF-8" standalone="no"?>
<svg xmlns="http://www.w3.org/2000/svg" width="940" height="580" viewBox="0 0 940 580" font-family="Arial, Helvetica, sans-serif" font-size="13">
  <title>The four action triggers</title>
  <rect width="940" height="580" fill="#ffffff"/>
  <text xml:space="preserve" x="12" y="50" font-size="14" font-weight="bold"><tspan font-family="Consolas, 'Courier New', monospace" font-size="14.84">timed</tspan></text>
  <text x="12" y="72" font-size="12">at a point in time</text>
  <line x1="12" y1="148" x2="928" y2="148" stroke="#888888" stroke-width="1"/>
  <text xml:space="preserve" x="12" y="182" font-size="14" font-weight="bold"><tspan font-family="Consolas, 'Courier New', monospace" font-size="14.84">event</tspan></text>
  <text x="12" y="204" font-size="12">when the server</text>
  <text x="12" y="219" font-size="12">asserts an event</text>
  <line x1="12" y1="280" x2="928" y2="280" stroke="#888888" stroke-width="1"/>
  <text xml:space="preserve" x="12" y="314" font-size="14" font-weight="bold"><tspan font-family="Consolas, 'Courier New', monospace" font-size="14.84">action</tspan></text>
  <text x="12" y="336" font-size="12">after another</text>
  <text x="12" y="351" font-size="12">action completed</text>
  <line x1="12" y1="438" x2="928" y2="438" stroke="#888888" stroke-width="1"/>
  <text xml:space="preserve" x="12" y="472" font-size="14" font-weight="bold"><tspan font-family="Consolas, 'Courier New', monospace" font-size="14.84">bind</tspan></text>
  <text x="12" y="494" font-size="12">together with</text>
  <text x="12" y="509" font-size="12">another action</text>
  <line x1="220" y1="108" x2="920" y2="108" stroke="#888888" stroke-width="1"/>
  <polygon points="250,108 244.6,99 255.4,99" fill="#000000"/>
  <text x="250" y="92" text-anchor="middle">Directive received</text>
  <rect x="560" y="74" width="90" height="30" fill="#ffffff" stroke="#000000" stroke-width="1.5"/>
  <text x="605" y="93.55" text-anchor="middle">Action</text>
  <line x1="250" y1="124" x2="250" y2="140" stroke="#000000" stroke-width="1"/>
  <line x1="560" y1="124" x2="560" y2="140" stroke="#000000" stroke-width="1"/>
  <line x1="257" y1="132" x2="553" y2="132" stroke="#000000" stroke-width="1"/>
  <polygon points="560,132 550,136 550,128" fill="#000000"/>
  <polygon points="250,132 260,128 260,136" fill="#000000"/>
  <text xml:space="preserve" x="405" y="126" text-anchor="middle"><tspan font-family="Consolas, 'Courier New', monospace" font-size="13.78">offset</tspan> (or the absolute time <tspan font-family="Consolas, 'Courier New', monospace" font-size="13.78">ptime</tspan>)</text>
  <line x1="560" y1="108" x2="560" y2="124" stroke="#888888" stroke-width="1" stroke-dasharray="3 3"/>
  <line x1="220" y1="240" x2="920" y2="240" stroke="#888888" stroke-width="1"/>
  <line x1="300" y1="202" x2="300" y2="230" stroke="#000000" stroke-width="2"/>
  <polygon points="300,238 296,228 304,228" fill="#000000"/>
  <text xml:space="preserve" x="310" y="218">one of the <tspan font-family="Consolas, 'Courier New', monospace" font-size="13.78">events</tspan> is asserted</text>
  <rect x="640" y="206" width="90" height="30" fill="#ffffff" stroke="#000000" stroke-width="1.5"/>
  <text x="685" y="225.55" text-anchor="middle">Action</text>
  <line x1="300" y1="256" x2="300" y2="272" stroke="#000000" stroke-width="1"/>
  <line x1="640" y1="256" x2="640" y2="272" stroke="#000000" stroke-width="1"/>
  <line x1="307" y1="264" x2="633" y2="264" stroke="#000000" stroke-width="1"/>
  <polygon points="640,264 630,268 630,260" fill="#000000"/>
  <polygon points="300,264 310,260 310,268" fill="#000000"/>
  <text xml:space="preserve" x="470" y="258" text-anchor="middle"><tspan font-family="Consolas, 'Courier New', monospace" font-size="13.78">delay</tspan> (optional)</text>
  <line x1="640" y1="240" x2="640" y2="256" stroke="#888888" stroke-width="1" stroke-dasharray="3 3"/>
  <line x1="220" y1="372" x2="920" y2="372" stroke="#888888" stroke-width="1"/>
  <rect x="250" y="338" width="130" height="30" fill="#e4e4e4" stroke="#000000" stroke-width="1.5"/>
  <text x="315" y="357.55" text-anchor="middle">Parent action</text>
  <rect x="560" y="338" width="90" height="30" fill="#ffffff" stroke="#000000" stroke-width="1.5"/>
  <text x="605" y="357.55" text-anchor="middle">Action</text>
  <line x1="380" y1="388" x2="380" y2="404" stroke="#000000" stroke-width="1"/>
  <line x1="560" y1="388" x2="560" y2="404" stroke="#000000" stroke-width="1"/>
  <line x1="387" y1="396" x2="553" y2="396" stroke="#000000" stroke-width="1"/>
  <polygon points="560,396 550,400 550,392" fill="#000000"/>
  <polygon points="380,396 390,392 390,400" fill="#000000"/>
  <text xml:space="preserve" x="470" y="390" text-anchor="middle"><tspan font-family="Consolas, 'Courier New', monospace" font-size="13.78">delay</tspan> (optional)</text>
  <line x1="560" y1="372" x2="560" y2="388" stroke="#888888" stroke-width="1" stroke-dasharray="3 3"/>
  <text xml:space="preserve" x="250" y="420" font-size="12">Starts always (<tspan font-family="Consolas, 'Courier New', monospace" font-size="12.72">actDepDefault</tspan>), if the parent returned <tspan font-family="Consolas, 'Courier New', monospace" font-size="12.72">actSuccess</tspan> (<tspan font-family="Consolas, 'Courier New', monospace" font-size="12.72">actDepSuccess</tspan>), or if it did not (<tspan font-family="Consolas, 'Courier New', monospace" font-size="12.72">actDepError</tspan>).</text>
  <rect x="300" y="466" width="300" height="30" fill="#e4e4e4" stroke="#000000" stroke-width="1.5"/>
  <text xml:space="preserve" x="450" y="485.55" text-anchor="middle">Action with <tspan font-family="Consolas, 'Courier New', monospace" font-size="13.78">tag</tspan> = 42 on endpoint 2</text>
  <rect x="300" y="504" width="300" height="30" fill="#ffffff" stroke="#000000" stroke-width="1.5"/>
  <text xml:space="preserve" x="450" y="523.55" text-anchor="middle">Action with <tspan font-family="Consolas, 'Courier New', monospace" font-size="13.78">bind</tspan> = 42 on endpoint 3</text>
  <line x1="300" y1="460" x2="300" y2="540" stroke="#888888" stroke-width="1" stroke-dasharray="3 3"/>
  <line x1="600" y1="460" x2="600" y2="540" stroke="#888888" stroke-width="1" stroke-dasharray="3 3"/>
  <text x="620" y="486">Both actions run concurrently.</text>
  <text x="620" y="524">They refer to different endpoints.</text>
  <line x1="220" y1="558" x2="912" y2="558" stroke="#000000" stroke-width="1.5"/>
  <polygon points="920,558 910,562 910,554" fill="#000000"/>
  <text x="920" y="572" text-anchor="end">time</text>
</svg>
