<?xml version="1.0" encoding="UTF-8" standalone="no"?>
<svg xmlns="http://www.w3.org/2000/svg" width="780" height="372" viewBox="0 0 780 372" font-family="Arial, Helvetica, sans-serif" font-size="13">
  <title>PWM output: start, change of the parameters, and stop</title>
  <rect width="780" height="372" fill="#ffffff"/>
  <text xml:space="preserve" x="12" y="26"><tspan font-weight="bold" font-size="14">PWM output</tspan>: each cycle is a low pulse followed by a high pulse</text>
  <line x1="136" y1="160" x2="770" y2="160" stroke="#888888" stroke-width="1" stroke-dasharray="4 3"/>
  <line x1="136" y1="214" x2="770" y2="214" stroke="#888888" stroke-width="1" stroke-dasharray="4 3"/>
  <path d="M 136 214 H 294 V 160 H 346 V 214 H 424 V 160 H 476 V 214 H 530 V 160 H 656 V 214 H 770" fill="none" stroke="#000000" stroke-width="2"/>
  <text x="72" y="194" text-anchor="end" font-size="14" font-weight="bold">PWM</text>
  <text x="128" y="165" text-anchor="end">VCC</text>
  <text x="128" y="219" text-anchor="end">GND</text>
  <text x="176" y="205" text-anchor="middle">stopped</text>
  <text x="713" y="205" text-anchor="middle">stopped</text>
  <text xml:space="preserve" x="216" y="58" text-anchor="middle"><tspan font-family="Consolas, 'Courier New', monospace" font-size="13.78">opStart</tspan></text>
  <text x="216" y="77" text-anchor="middle" xml:space="preserve">(<tspan font-style="italic">f</tspan><tspan font-size="10" dy="3">PWM</tspan><tspan dy="-3">, </tspan><tspan font-style="italic">D</tspan>)</text>
  <line x1="216" y1="88" x2="216" y2="142" stroke="#000000" stroke-width="2"/>
  <polygon points="216,150 212,140 220,140" fill="#000000"/>
  <text xml:space="preserve" x="385" y="58" text-anchor="middle"><tspan font-family="Consolas, 'Courier New', monospace" font-size="13.78">fldCmd</tspan></text>
  <text x="385" y="77" text-anchor="middle" xml:space="preserve">(new <tspan font-style="italic">f</tspan><tspan font-size="10" dy="3">PWM</tspan><tspan dy="-3">, </tspan><tspan font-style="italic">D</tspan>)</text>
  <line x1="385" y1="88" x2="385" y2="142" stroke="#000000" stroke-width="2"/>
  <polygon points="385,150 381,140 389,140" fill="#000000"/>
  <line x1="385" y1="114" x2="469" y2="114" stroke="#000000" stroke-width="1.5" stroke-dasharray="5 3"/>
  <polygon points="476,114 466,118 466,110" fill="#000000"/>
  <line x1="476" y1="114" x2="476" y2="156" stroke="#888888" stroke-width="1" stroke-dasharray="3 3"/>
  <text xml:space="preserve" x="595" y="58" text-anchor="middle"><tspan font-family="Consolas, 'Courier New', monospace" font-size="13.78">opStop</tspan></text>
  <line x1="595" y1="68" x2="595" y2="142" stroke="#000000" stroke-width="2"/>
  <polygon points="595,150 591,140 599,140" fill="#000000"/>
  <line x1="595" y1="114" x2="649" y2="114" stroke="#000000" stroke-width="1.5" stroke-dasharray="5 3"/>
  <polygon points="656,114 646,118 646,110" fill="#000000"/>
  <line x1="656" y1="114" x2="656" y2="156" stroke="#888888" stroke-width="1" stroke-dasharray="3 3"/>
  <line x1="216" y1="218" x2="216" y2="266" stroke="#000000" stroke-width="1"/>
  <line x1="294" y1="218" x2="294" y2="266" stroke="#000000" stroke-width="1"/>
  <line x1="223" y1="258" x2="287" y2="258" stroke="#000000" stroke-width="1"/>
  <polygon points="294,258 284,262 284,254" fill="#000000"/>
  <polygon points="216,258 226,254 226,262" fill="#000000"/>
  <text xml:space="preserve" x="255" y="252" text-anchor="middle"><tspan font-style="italic">t</tspan><tspan font-size="10" dy="3">LOW</tspan></text>
  <line x1="294" y1="218" x2="294" y2="266" stroke="#000000" stroke-width="1"/>
  <line x1="346" y1="218" x2="346" y2="266" stroke="#000000" stroke-width="1"/>
  <line x1="301" y1="258" x2="339" y2="258" stroke="#000000" stroke-width="1"/>
  <polygon points="346,258 336,262 336,254" fill="#000000"/>
  <polygon points="294,258 304,254 304,262" fill="#000000"/>
  <text xml:space="preserve" x="320" y="252" text-anchor="middle"><tspan font-style="italic">t</tspan><tspan font-size="10" dy="3">HIGH</tspan></text>
  <line x1="216" y1="294" x2="216" y2="316" stroke="#000000" stroke-width="1"/>
  <line x1="346" y1="294" x2="346" y2="316" stroke="#000000" stroke-width="1"/>
  <line x1="223" y1="308" x2="339" y2="308" stroke="#000000" stroke-width="1"/>
  <polygon points="346,308 336,312 336,304" fill="#000000"/>
  <polygon points="216,308 226,304 226,312" fill="#000000"/>
  <text xml:space="preserve" x="281" y="302" text-anchor="middle">1 / <tspan font-style="italic">f</tspan><tspan font-size="10" dy="3">PWM</tspan></text>
  <line x1="346" y1="294" x2="346" y2="316" stroke="#000000" stroke-width="1"/>
  <line x1="476" y1="294" x2="476" y2="316" stroke="#000000" stroke-width="1"/>
  <line x1="353" y1="308" x2="469" y2="308" stroke="#000000" stroke-width="1"/>
  <polygon points="476,308 466,312 466,304" fill="#000000"/>
  <polygon points="346,308 356,304 356,312" fill="#000000"/>
  <text xml:space="preserve" x="411" y="302" text-anchor="middle">1 / <tspan font-style="italic">f</tspan><tspan font-size="10" dy="3">PWM</tspan></text>
  <line x1="476" y1="294" x2="476" y2="316" stroke="#000000" stroke-width="1"/>
  <line x1="656" y1="294" x2="656" y2="316" stroke="#000000" stroke-width="1"/>
  <line x1="483" y1="308" x2="649" y2="308" stroke="#000000" stroke-width="1"/>
  <polygon points="656,308 646,312 646,304" fill="#000000"/>
  <polygon points="476,308 486,304 486,312" fill="#000000"/>
  <text xml:space="preserve" x="566" y="302" text-anchor="middle">1 / new <tspan font-style="italic">f</tspan><tspan font-size="10" dy="3">PWM</tspan></text>
  <line x1="216" y1="266" x2="216" y2="294" stroke="#888888" stroke-width="1" stroke-dasharray="3 3"/>
  <line x1="346" y1="266" x2="346" y2="294" stroke="#888888" stroke-width="1" stroke-dasharray="3 3"/>
  <line x1="476" y1="218" x2="476" y2="294" stroke="#888888" stroke-width="1" stroke-dasharray="3 3"/>
  <line x1="656" y1="218" x2="656" y2="294" stroke="#888888" stroke-width="1" stroke-dasharray="3 3"/>
  <text x="12" y="334" xml:space="preserve"><tspan font-style="italic">t</tspan><tspan font-size="10" dy="3">LOW</tspan><tspan dy="-3"> = (1 − </tspan><tspan font-style="italic">D</tspan>) / <tspan font-style="italic">f</tspan><tspan font-size="10" dy="3">PWM</tspan><tspan dy="-3"> and </tspan><tspan font-style="italic">t</tspan><tspan font-size="10" dy="3">HIGH</tspan><tspan dy="-3"> = </tspan><tspan font-style="italic">D</tspan> / <tspan font-style="italic">f</tspan><tspan font-size="10" dy="3">PWM</tspan><tspan dy="-3">, with 0 ≤ </tspan><tspan font-style="italic">D</tspan> ≤ 1.</text>
  <text xml:space="preserve" x="12" y="356">A new <tspan font-family="Consolas, 'Courier New', monospace" font-size="13.78">fldCmd</tspan> or <tspan font-family="Consolas, 'Courier New', monospace" font-size="13.78">opStop</tspan> waits (dashed arrow) for the end of the running cycle.</text>
</svg>
