<?xml version="1.0" encoding="UTF-8" standalone="no"?>
<svg xmlns="http://www.w3.org/2000/svg" width="940" height="340" viewBox="0 0 940 340" font-family="Arial, Helvetica, sans-serif" font-size="13">
  <title>PLCA cycle: beacon and transmit opportunities</title>
  <defs>
    <pattern id="hatch" width="6" height="6" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><line x1="0" y1="0" x2="0" y2="6" stroke="#9a9a9a" stroke-width="1.5"/></pattern>
  </defs>
  <rect width="940" height="340" fill="#ffffff"/>
  <text xml:space="preserve" x="12" y="24">Network with <tspan font-family="Consolas, 'Courier New', monospace" font-size="13.78">nodeCount</tspan> = 4: node 0 is the coordinator, nodes 1 to 3 share the medium</text>
  <rect x="70" y="128" width="64" height="46" fill="#e4e4e4" stroke="#000000" stroke-width="1.5"/>
  <text x="102" y="155.55" text-anchor="middle">Beacon</text>
  <rect x="134" y="128" width="150" height="46" fill="#ffffff" stroke="#000000" stroke-width="1.5"/>
  <text x="209" y="155.55" text-anchor="middle">Frame of node 0</text>
  <rect x="284" y="128" width="56" height="46" fill="url(#hatch)" stroke="#000000" stroke-width="1.5"/>
  <rect x="340" y="128" width="210" height="46" fill="#ffffff" stroke="#000000" stroke-width="1.5"/>
  <text x="445" y="155.55" text-anchor="middle">Frame of node 2</text>
  <rect x="550" y="128" width="56" height="46" fill="url(#hatch)" stroke="#000000" stroke-width="1.5"/>
  <rect x="606" y="128" width="64" height="46" fill="#e4e4e4" stroke="#000000" stroke-width="1.5"/>
  <text x="638" y="155.55" text-anchor="middle">Beacon</text>
  <rect x="670" y="128" width="146" height="46" fill="#ffffff" stroke="#000000" stroke-width="1.5"/>
  <text x="743" y="155.55" text-anchor="middle">Frame of node 0</text>
  <line x1="70" y1="58" x2="70" y2="80" stroke="#000000" stroke-width="1"/>
  <line x1="606" y1="58" x2="606" y2="80" stroke="#000000" stroke-width="1"/>
  <line x1="77" y1="66" x2="599" y2="66" stroke="#000000" stroke-width="1"/>
  <polygon points="606,66 596,70 596,62" fill="#000000"/>
  <polygon points="70,66 80,62 80,70" fill="#000000"/>
  <text x="338" y="60" text-anchor="middle">PLCA cycle</text>
  <line x1="134" y1="98" x2="134" y2="114" stroke="#000000" stroke-width="1"/>
  <line x1="284" y1="98" x2="284" y2="114" stroke="#000000" stroke-width="1"/>
  <line x1="141" y1="104" x2="277" y2="104" stroke="#000000" stroke-width="1"/>
  <polygon points="284,104 274,108 274,100" fill="#000000"/>
  <polygon points="134,104 144,100 144,108" fill="#000000"/>
  <text x="209" y="98" text-anchor="middle">TO 0</text>
  <line x1="284" y1="98" x2="284" y2="114" stroke="#000000" stroke-width="1"/>
  <line x1="340" y1="98" x2="340" y2="114" stroke="#000000" stroke-width="1"/>
  <line x1="291" y1="104" x2="333" y2="104" stroke="#000000" stroke-width="1"/>
  <polygon points="340,104 330,108 330,100" fill="#000000"/>
  <polygon points="284,104 294,100 294,108" fill="#000000"/>
  <text x="312" y="98" text-anchor="middle">TO 1</text>
  <line x1="340" y1="98" x2="340" y2="114" stroke="#000000" stroke-width="1"/>
  <line x1="550" y1="98" x2="550" y2="114" stroke="#000000" stroke-width="1"/>
  <line x1="347" y1="104" x2="543" y2="104" stroke="#000000" stroke-width="1"/>
  <polygon points="550,104 540,108 540,100" fill="#000000"/>
  <polygon points="340,104 350,100 350,108" fill="#000000"/>
  <text x="445" y="98" text-anchor="middle">TO 2</text>
  <line x1="550" y1="98" x2="550" y2="114" stroke="#000000" stroke-width="1"/>
  <line x1="606" y1="98" x2="606" y2="114" stroke="#000000" stroke-width="1"/>
  <line x1="557" y1="104" x2="599" y2="104" stroke="#000000" stroke-width="1"/>
  <polygon points="606,104 596,108 596,100" fill="#000000"/>
  <polygon points="550,104 560,100 560,108" fill="#000000"/>
  <text x="578" y="98" text-anchor="middle">TO 3</text>
  <line x1="670" y1="98" x2="670" y2="114" stroke="#000000" stroke-width="1"/>
  <line x1="816" y1="98" x2="816" y2="114" stroke="#000000" stroke-width="1"/>
  <line x1="677" y1="104" x2="809" y2="104" stroke="#000000" stroke-width="1"/>
  <polygon points="816,104 806,108 806,100" fill="#000000"/>
  <polygon points="670,104 680,100 680,108" fill="#000000"/>
  <text x="743" y="98" text-anchor="middle">TO 0</text>
  <line x1="40" y1="206" x2="902" y2="206" stroke="#000000" stroke-width="1.5"/>
  <polygon points="910,206 900,210 900,202" fill="#000000"/>
  <text x="910" y="226" text-anchor="end">time</text>
  <rect x="12" y="252" width="40" height="18" fill="#e4e4e4" stroke="#000000" stroke-width="1.5"/>
  <text x="64" y="266">Beacon, sent by the coordinator at the start of every cycle</text>
  <rect x="12" y="278" width="40" height="18" fill="#ffffff" stroke="#000000" stroke-width="1.5"/>
  <text x="64" y="292">Frame, sent by the node that owns the transmit opportunity (TO)</text>
  <rect x="12" y="304" width="40" height="18" fill="url(#hatch)" stroke="#000000" stroke-width="1.5"/>
  <text xml:space="preserve" x="64" y="318">Unused opportunity: the next one starts when the TO timer (<tspan font-family="Consolas, 'Courier New', monospace" font-size="13.78">toTimer</tspan> bit times) expires</text>
</svg>
